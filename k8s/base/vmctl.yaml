# The control plane: API + scheduler + reconciler. A Deployment, because it
# holds no state of its own: everything is in kv. Kill it at any moment and
# the replacement pod continues from kv.
#
# 3 replicas, all serving the API behind the Service. Only the leader, the
# replica holding the kv key leases/vmctl (LEASE_TTL, renewed every
# LEASE_RENEW), runs the reconciler. If it dies, another replica takes over
# within about one TTL. See docs/adr/0002-kv-backed-leader-lease.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmctl
  namespace: vmaas
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vmctl
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: /metrics
      labels:
        app: vmctl
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      # Kubernetes sends SIGTERM, waits this long, then SIGKILL. vmctl's
      # signal.NotifyContext turns SIGTERM into a cancelled context.
      terminationGracePeriodSeconds: 15
      containers:
        - name: vmctl
          image: vmaas-sim:dev
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/vmctl"]
          env:
            - name: ADDR
              value: ":8090"
            # Lease holder identity: the pod name, via the Downward API.
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          envFrom:
            - configMapRef:
                name: vmaas-config
          ports:
            - name: http
              containerPort: 8090
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 2
            timeoutSeconds: 1
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: vmctl
  namespace: vmaas
spec:
  selector:
    app: vmctl
  ports:
    - name: http
      port: 8090
      targetPort: http
