# GKE Autopilot. __GKE_IMAGE__ and __GKE_TAG__ are substituted by `make gke-up`
# (sed, exact tokens) so this file never needs editing. The storageClass is left unset on
# purpose: the cluster default (pd-balanced via CSI) is used. Autopilot needs
# resource requests, which the base already sets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: vmaas-sim
    newName: __GKE_IMAGE__
    newTag: __GKE_TAG__
# Fresh nodes pull from a registry: always check the tag.
patches:
  - target: { kind: StatefulSet }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
