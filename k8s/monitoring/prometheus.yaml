# Prometheus: pull-based scraping. It asks the Kubernetes API for pods
# (kubernetes_sd_configs, role: pod) and scrapes the ones annotated
# prometheus.io/scrape: "true", at the port and path from their annotations.
# That is why it needs a ServiceAccount that can list/watch pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: vmaas
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmaas-prometheus
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmaas-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vmaas-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: vmaas
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: vmaas
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s   # short for a live demo; production uses 15-60s
    scrape_configs:
      - job_name: vmaas-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [vmaas]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Rewrite the target address to <podIP>:<annotated port>.
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: vmaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2h
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {} # metrics are lost when the pod restarts; fine locally
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: vmaas
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
